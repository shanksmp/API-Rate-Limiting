global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rate-limiter
    metrics_path: /actuator/prometheus
    dns_sd_configs:              # discovers every app replica behind the compose DNS name
      - names: [app]
        type: A
        port: 8081
        refresh_interval: 10s

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
