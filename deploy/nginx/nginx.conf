worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  server_tokens off;
  access_log off;              # load-test friendly; app metrics cover traffic
  error_log /dev/stderr warn;

  # Compose DNS returns every app replica; NGINX round-robins across them
  upstream rate_limiter {
    server app:8080 max_fails=3 fail_timeout=5s;
    keepalive 256;
  }

  # Coarse brute-force protection for the admin API (on top of its bearer token)
  limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
  limit_req_status 429;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  client_max_body_size 16k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 8k;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  server {
    listen 8080;

    # Actuator is served on the app's management port and must never be reachable through the proxy
    location /actuator { return 404; }

    location /admin/ {
      limit_req zone=admin burst=20 nodelay;
      proxy_pass http://rate_limiter;
    }

    location / {
      proxy_pass http://rate_limiter;
    }
  }
}
